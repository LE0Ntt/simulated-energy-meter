set_meter_value:
  name: Zählerstand setzen
  description: Setzt den simulierten Stromzähler direkt auf einen kWh-Wert (ohne Lernen).
  fields:
    kwh_value:
      name: kWh-Wert
      description: Neuer Zählerstand in Kilowattstunden.
      required: true
      selector:
        number:
          min: 0
          max: 999999
          step: 0.001
          unit_of_measurement: kWh
          mode: box

calibrate:
  name: Kalibrieren & Lernen
  description: >
    Synchronisiert den Simulator mit dem echten Stromzähler UND löst das
    Lernsystem aus. Ab der 3. Kalibrierung werden die Profile gezielt für
    den Tageszeit-Slot angepasst, der am meisten zur Abweichung beigetragen hat.
  fields:
    kwh_value:
      name: Echter Zählerstand (kWh)
      description: Den aktuellen Stand vom echten Stromzähler ablesen und hier eingeben.
      required: true
      selector:
        number:
          min: 0
          max: 999999
          step: 0.001
          unit_of_measurement: kWh
          mode: box
