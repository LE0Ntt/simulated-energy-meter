set_meter_value:
  name: Zählerstand setzen
  description: Setzt den simulierten Stromzähler auf einen bestimmten kWh-Wert.
  fields:
    kwh_value:
      name: kWh-Wert
      description: Der neue Zählerstand in Kilowattstunden.
      required: true
      selector:
        number:
          min: 0
          max: 999999
          step: 0.001
          unit_of_measurement: kWh
          mode: box

calibrate:
  name: Kalibrieren
  description: >
    Synchronisiert den Simulator mit dem echten physischen Stromzähler.
    Einfach den aktuellen Stand ablesen und eingeben — der Simulator
    springt auf diesen Wert und läuft ab dann mit den Live-Werten weiter.
  fields:
    kwh_value:
      name: Echter Zählerstand (kWh)
      description: Der aktuell vom echten Zähler abgelesene Stand.
      required: true
      selector:
        number:
          min: 0
          max: 999999
          step: 0.001
          unit_of_measurement: kWh
          mode: box
